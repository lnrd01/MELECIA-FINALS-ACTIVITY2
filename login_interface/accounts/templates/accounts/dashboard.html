{% load static %}
{% static 'css/src/whole_bg.png' as body_bg %}
{% static 'css/src/logo.png' as logo %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-dvh flex items-center justify-center p-6 text-white font-['Space_Mono'] bg-[#b4c6d6]">

    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden bg-[#b4c6d6]">
        <div class="absolute inset-0 bg-cover bg-center scale-[1.4]"
             style="background-image: url({{ body_bg }});"></div>
    </div>

    <!-- Card -->
    <div class="w-full max-w-md bg-[#083a63] rounded-[2.5rem] px-10 py-12 text-center">

        <img src="{{ logo }}" alt="Logo" class="w-20 h-20 mx-auto">

        <h1 class="font-bold text-3xl mt-8">Welcome to my site</h1>

        <!-- Logout must be a POST form in newer Django versions -->
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full mt-10 bg-black text-white text-xl py-4 rounded-xl hover:bg-gray-900 transition cursor-pointer">
                Logout
            </button>
        </form>

    </div>

</body>
</html>
